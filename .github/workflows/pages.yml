name: Downloads and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_public_site:
        description: "Publish the website publicly (a private repository does not make Pages private)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: downloads-and-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify downloads and prepare the website
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.metadata.outputs.preview }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "24"}
      - name: Verify installer checksums and download metadata
        id: metadata
        run: node verify-downloads.mjs
      - name: Prepare only the website files
        run: |
          mkdir _site
          cp index.html page.css page.js release.json .nojekyll _site/
      - uses: actions/upload-artifact@v7
        with:
          name: download-page
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Make the private test installers available
    needs: prepare
    if: needs.prepare.outputs.preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish only inside a private repository
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          private="$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)"
          if [ "$private" != true ]; then
            echo "Unsigned test installers are published only while this repository is private."
            exit 1
          fi
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This preview is already published. Existing files are kept."
          else
            gh release create "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "PartTrace 2026.10.0 testing preview" \
              --notes-file downloads/INSTALL.txt downloads/*.exe downloads/*.apk downloads/SHA256SUMS.txt downloads/INSTALL.txt
          fi

  deploy-pages:
    name: Publish the public website only when explicitly selected
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.publish_public_site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: download-page
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
