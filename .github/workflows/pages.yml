name: Downloads and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_public_site:
        description: "Publish the website publicly (a private repository does not make Pages private)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: downloads-and-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the download links and prepare the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "24"}
      # Testing previews are published here by the source repository's preview workflow.
      - name: Check the download links
        run: node verify-downloads.mjs
      - name: Prepare only the website files
        run: |
          mkdir _site
          cp index.html page.css page.js release.json .nojekyll _site/
      - uses: actions/upload-artifact@v7
        with:
          name: download-page
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    name: Publish the public website only when explicitly selected
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.publish_public_site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: download-page
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
